name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a semantic version like 1.2.3 or 1.2.3-beta.1" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/koemmerle-at-home/package-lock.json

      - name: Sync version
        run: scripts/sync-version.sh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Restore .NET dependencies
        run: dotnet restore KoemmerleAtHome.sln

      - name: Build solution
        run: dotnet build KoemmerleAtHome.sln --configuration Release --no-restore

      - name: Publish macOS apps
        run: scripts/publish-macos.sh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          for runtime in osx-x64 osx-arm64; do
            tar -czf "artifacts/koemmerle-at-home-${{ steps.version.outputs.version }}-$runtime.tar.gz" \
              -C release "$runtime"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koemmerle-at-home-${{ steps.version.outputs.version }}-macos
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          title="Kömmerle At Home ${{ steps.version.outputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.tar.gz --clobber
          else
            gh release create "$tag" artifacts/*.tar.gz \
              --title "$title" \
              --generate-notes
          fi
